<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cKz Loop Generator</title>
<style>
  :root{
    --bg:#0d0e12; --panel:#15171e; --panel2:#1c1f29; --line:#272b37;
    --txt:#e7e9ef; --dim:#8c92a4; --accent:#7c5cff; --accent2:#34d3a6;
    --warn:#f0a93b; --bad:#ef5b6b; --keep:#34d3a6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:10;background:rgba(13,14,18,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;letter-spacing:.3px}
  h1 .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--dim)}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
    padding:2px 9px}
  .chip.mock{color:var(--warn);border-color:#4a3a18}
  .chip.real{color:var(--accent2);border-color:#1d4438}
  .tabs{display:flex;gap:4px;margin-left:auto}
  .tab{background:none;border:1px solid var(--line);color:var(--dim);
    padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px}
  .tab.active{color:var(--txt);border-color:var(--accent);background:var(--panel2)}
  main{max-width:1180px;margin:0 auto;padding:20px 22px 80px}
  .controls{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;margin-bottom:22px}
  .ctl{display:flex;flex-direction:column;gap:5px}
  .ctl label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  select,input[type=number]{background:var(--panel2);border:1px solid var(--line);
    color:var(--txt);border-radius:8px;padding:8px 10px;font-size:13px;min-width:90px}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:9px;
    padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-weight:500}
  .btn.sm{padding:6px 11px;font-size:12px;border-radius:7px}
  .hint{color:var(--dim);font-size:12px;margin-left:auto;max-width:340px;text-align:right}
  .group-label{font-size:12px;color:var(--dim);margin:18px 2px 10px;
    display:flex;align-items:center;gap:8px}
  .group-label::after{content:"";flex:1;height:1px;background:var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px;display:flex;flex-direction:column;gap:11px;position:relative}
  .card.kept{border-color:var(--keep)}
  .card.sparse{border-color:#5a3a1a}
  .card.err{border-color:var(--bad)}
  .crow{display:flex;align-items:center;gap:9px}
  .ttl{font-weight:600;font-size:15px}
  .key{font-family:ui-monospace,Menlo,monospace;color:var(--accent2);font-size:13px}
  .meta{color:var(--dim);font-size:11.5px;margin-left:auto;text-align:right}
  .prompt{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim);
    background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    padding:6px 8px;word-break:break-word}
  .wave{width:100%;height:64px;background:var(--panel2);border-radius:8px;cursor:pointer;display:block}
  .status{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12.5px;height:64px;
    justify-content:center;background:var(--panel2);border-radius:8px}
  .spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .play{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);cursor:pointer;font-size:13px;flex:0 0 auto}
  .tag{font-size:10.5px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .tag.sparse{color:var(--warn);border-color:#4a3a18}
  .tag.kept{color:var(--keep);border-color:#1d4438}
  .tag.bold{color:var(--accent);border-color:#3a2e6e}
  .spacer{flex:1}
  .refbtns{display:none;gap:6px}
  .refbtns.open{display:flex}
  .empty{color:var(--dim);text-align:center;padding:60px 0;font-size:14px}
  a.reflink{color:var(--accent2);font-size:11.5px;cursor:pointer;text-decoration:none}
  a.reflink:hover{text-decoration:underline}
</style>
</head>
<body>
<header>
  <h1>cKz <span class="mono">Loop Generator</span></h1>
  <div class="chips" id="chips"></div>
  <div class="tabs">
    <button class="tab active" data-tab="discover" onclick="setTab('discover')">Discover</button>
    <button class="tab" data-tab="library" onclick="setTab('library')">Library <span id="kcount"></span></button>
  </div>
</header>

<main>
  <!-- DISCOVER -->
  <section id="tab-discover">
    <div class="controls">
      <div class="ctl">
        <label>Clips</label>
        <input type="number" id="count" value="4" min="1" max="24" />
      </div>
      <div class="ctl">
        <label>Melody spread</label>
        <select id="keymode">
          <option value="both">Both (match + tritone)</option>
          <option value="match">Match key</option>
          <option value="tritone">Tritone</option>
        </select>
      </div>
      <button class="btn" id="genbtn" onclick="discover()">Generate</button>
      <div class="hint" id="genhint">Each clip ≈ 1 min on the real model. Foreign minor+dense loop → cKz repaint. Vary loop/key/seed.</div>
    </div>
    <div id="feed"></div>
    <div class="empty" id="feedempty">No clips yet — hit Generate to discover new melodies.</div>
  </section>

  <!-- LIBRARY -->
  <section id="tab-library" style="display:none">
    <div class="grid" id="libgrid"></div>
    <div class="empty" id="libempty">Nothing kept yet. Keep clips from Discover to build your library.</div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const api = (p,o) => fetch(p,o).then(r => r.ok ? r.json() : r.json().then(e=>{throw new Error(e.detail||r.status)}));

let audioCtx;
const peakCache = {};   // url -> Float32 peaks
let nowPlaying = null;  // {audio, btn}

// ── status ──────────────────────────────────────────────────────────────
async function loadStatus(){
  const s = await api('/api/status');
  const e = s.settings;
  $('#chips').innerHTML =
    `<span class="chip ${s.mock?'mock':'real'}">${s.mock?'MOCK engine':'aug-8000'}</span>`+
    `<span class="chip">${s.loops} loops</span>`+
    `<span class="chip">cfg ${e.cfg} · ${e.steps} steps · ${e.sampler}</span>`+
    `<span class="chip">σ disc ${e.sigma_discover} · sub ${e.sigma_subtle} · bold ${e.sigma_bold}</span>`;
  $('#kcount').textContent = s.kept ? `(${s.kept})` : '';
  if(s.mock){ $('#genhint').textContent = 'MOCK engine: placeholder audio, instant. Run without --mock on the Mac for real cKz clips.'; }
  if(s.loops===0 && !s.mock){ $('#genhint').innerHTML = '⚠ Loop library empty — run <code>uv run python -m app.index_loops</code> on the Mac first.'; }
}

// ── tabs ────────────────────────────────────────────────────────────────
function setTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  $('#tab-discover').style.display = t==='discover'?'block':'none';
  $('#tab-library').style.display = t==='library'?'block':'none';
  if(t==='library') loadLibrary();
}

// ── waveform + playback ─────────────────────────────────────────────────
async function drawWave(canvas, url){
  try{
    let peaks = peakCache[url];
    if(!peaks){
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      const ab = await (await fetch(url)).arrayBuffer();
      const buf = await audioCtx.decodeAudioData(ab.slice(0));
      const ch = buf.getChannelData(0);
      const W = 480, block = Math.floor(ch.length / W) || 1;
      peaks = new Float32Array(W);
      for(let i=0;i<W;i++){
        let m=0; for(let j=0;j<block;j++){ const v=Math.abs(ch[i*block+j]||0); if(v>m)m=v; }
        peaks[i]=m;
      }
      peakCache[url]=peaks;
    }
    paintWave(canvas, peaks, 0);
  }catch(e){ /* leave blank */ }
}
function paintWave(canvas, peaks, progress){
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const g = canvas.getContext('2d'); g.scale(dpr,dpr);
  g.clearRect(0,0,w,h);
  const n = peaks.length, bw = w/n;
  for(let i=0;i<n;i++){
    const ph = Math.max(1, peaks[i]*h*0.92);
    const played = (i/n) <= progress;
    g.fillStyle = played ? '#7c5cff' : '#3a3f4d';
    g.fillRect(i*bw, (h-ph)/2, Math.max(1,bw-0.5), ph);
  }
}
function togglePlay(url, canvas, btn){
  if(nowPlaying){
    nowPlaying.audio.pause();
    nowPlaying.btn.textContent='▶';
    const was = nowPlaying.url===url;
    nowPlaying=null;
    if(was) return;
  }
  const audio = new Audio(url);
  btn.textContent='⏸';
  audio.play();
  nowPlaying = {audio, btn, url};
  const peaks = peakCache[url];
  audio.ontimeupdate = ()=>{ if(peaks && audio.duration) paintWave(canvas, peaks, audio.currentTime/audio.duration); };
  audio.onended = ()=>{ btn.textContent='▶'; if(peaks) paintWave(canvas,peaks,0); nowPlaying=null; };
}

// ── discover ────────────────────────────────────────────────────────────
async function discover(){
  const count = Math.max(1, Math.min(24, +$('#count').value||4));
  const key_mode = $('#keymode').value;
  $('#genbtn').disabled = true; $('#genbtn').textContent='Generating…';
  try{
    const job = await api('/api/discover',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({count, key_mode})});
    $('#feedempty').style.display='none';
    const sect = renderJobSection(job, 'Discovery');
    $('#feed').prepend(sect);
    pollJob(job.job_id, sect);
  }catch(e){ alert('discover failed: '+e.message); }
  finally{ $('#genbtn').disabled=false; $('#genbtn').textContent='Generate'; }
}

function renderJobSection(job, label){
  const sect = document.createElement('div');
  sect.dataset.job = job.job_id;
  const head = document.createElement('div');
  head.className='group-label';
  head.innerHTML = `<span>${label}</span>`;
  const grid = document.createElement('div');
  grid.className='grid';
  sect.append(head, grid);
  job.clips.forEach(c => grid.append(makeCard(c)));
  sect._head = head; sect._label = label;
  return sect;
}

async function pollJob(jobId, sect){
  let tries=0;
  const tick = async ()=>{
    let job;
    try{ job = await api('/api/jobs/'+jobId); }catch(e){ return; }
    job.clips.forEach(c => updateCard(c));
    sect._head.querySelector('span').textContent = `${sect._label} — ${job.done}/${job.total}`;
    if(job.done < job.total){ setTimeout(tick, 1400 + Math.min(tries++,5)*200); }
    else { sect._head.querySelector('span').textContent = `${sect._label} — done (${job.total})`; }
  };
  tick();
}

// ── card ────────────────────────────────────────────────────────────────
function makeCard(c){
  const card = document.createElement('div');
  card.className='card'; card.id='card-'+c.id; card.dataset.id=c.id;
  card.innerHTML = cardInner(c);
  return card;
}
function cardInner(c){
  return `
    <div class="crow">
      <span class="ttl">${esc(c.title||'—')}</span>
      <span class="key">${esc(c.key||'')}</span>
      <span class="meta">${c.bpm?c.bpm+' bpm · ':''}seed ${c.seed}<br>σ ${c.sigma??'—'}${c.refine_mode?' · '+c.refine_mode:''}</span>
    </div>
    <div class="prompt">${esc(c.prompt)}</div>
    <div class="body"></div>
    <div class="row foot"></div>`;
}
function updateCard(c){
  const card = $('#card-'+c.id); if(!card) return;
  card.classList.toggle('kept', !!c.kept);
  card.classList.toggle('sparse', c.status==='done' && c.sparse);
  card.classList.toggle('err', c.status==='error');
  const body = card.querySelector('.body');
  const foot = card.querySelector('.foot');
  if(c.status==='pending' || c.status==='running'){
    body.innerHTML = `<div class="status"><div class="spinner"></div>${c.status==='running'?'generating…':'queued'}</div>`;
    foot.innerHTML='';
    return;
  }
  if(c.status==='error'){
    body.innerHTML = `<div class="status" style="color:var(--bad)">⚠ ${esc(c.error||'failed')}</div>`;
    return;
  }
  // done
  if(!body.querySelector('canvas')){
    body.innerHTML = `<canvas class="wave"></canvas>`;
    const cv = body.querySelector('canvas');
    drawWave(cv, c.audio_url);
    cv.onclick = ()=>togglePlay(c.audio_url, cv, foot.querySelector('.play'));
  }
  const cv = body.querySelector('canvas');
  foot.innerHTML =
    `<button class="play" onclick="togglePlay('${c.audio_url}', this.closest('.card').querySelector('canvas'), this)">▶</button>`+
    (c.sparse?`<span class="tag sparse">sparse</span>`:``)+
    (c.kept?`<span class="tag kept">kept</span>`:``)+
    `<span class="spacer"></span>`+
    (c.init_url?`<a class="reflink" onclick="togglePlay('${c.init_url}', this.closest('.card').querySelector('canvas'), this.closest('.card').querySelector('.play'))">ref ♪</a>`:``)+
    (c.kept?``:`<button class="btn ghost sm keepbtn" onclick="keep('${c.id}')">Keep</button>`)+
    `<button class="btn ghost sm" onclick="discardCard('${c.id}')">✕</button>`+
    `<button class="btn ghost sm" onclick="toggleRefine('${c.id}','clip')">More ▾</button>`+
    `<div class="refbtns" id="ref-${c.id}">`+
      `<button class="btn sm" onclick="refine('clip:${c.id}','subtle')">subtle</button>`+
      `<button class="btn sm" onclick="refine('clip:${c.id}','bold')">bold</button>`+
    `</div>`;
}
function toggleRefine(id){ $('#ref-'+id).classList.toggle('open'); }
function discardCard(id){ const c=$('#card-'+id); if(c) c.remove(); }

async function keep(clipId){
  try{ await api('/api/keep',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clip_id:clipId})});
    const card=$('#card-'+clipId); if(card){ card.classList.add('kept');
      const kb=card.querySelector('.keepbtn'); if(kb) kb.remove();
      const foot=card.querySelector('.foot');
      if(!foot.querySelector('.tag.kept')) foot.querySelector('.spacer').insertAdjacentHTML('beforebegin','<span class="tag kept">kept</span>'); }
    loadStatus();
  }catch(e){ alert('keep failed: '+e.message); }
}

// ── refine ──────────────────────────────────────────────────────────────
async function refine(source, mode){
  const count = Math.max(1, Math.min(24, +$('#count').value||4));
  try{
    const job = await api('/api/refine',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({source, mode, count})});
    $('#feedempty').style.display='none';
    setTab('discover');
    const sect = renderJobSection(job, `Refine (${mode})`);
    $('#feed').prepend(sect);
    pollJob(job.job_id, sect);
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){ alert('refine failed: '+e.message); }
}

// ── library ─────────────────────────────────────────────────────────────
async function loadLibrary(){
  const {items} = await api('/api/library');
  $('#libempty').style.display = items.length?'none':'block';
  const grid = $('#libgrid'); grid.innerHTML='';
  items.forEach(it=>{
    const url = '/audio/'+it.wav;
    const card = document.createElement('div');
    card.className='card kept';
    card.innerHTML = `
      <div class="crow"><span class="ttl">${esc(it.title||'—')}</span>
        <span class="key">${esc(it.key||'')}</span>
        <span class="meta">${it.bpm?it.bpm+' bpm · ':''}seed ${it.seed}<br>σ ${it.sigma??'—'} · ${esc(it.kind)}</span></div>
      <div class="prompt">${esc(it.prompt)}</div>
      <canvas class="wave"></canvas>
      <div class="row">
        <button class="play">▶</button>
        ${it.sparse?'<span class="tag sparse">sparse</span>':''}
        <span class="spacer"></span>
        <button class="btn ghost sm" onclick="unkeep('${it.id}')">Remove</button>
        <button class="btn ghost sm" onclick="toggleRefine('${it.id}')">More ▾</button>
        <div class="refbtns" id="ref-${it.id}">
          <button class="btn sm" onclick="refine('kept:${it.id}','subtle')">subtle</button>
          <button class="btn sm" onclick="refine('kept:${it.id}','bold')">bold</button>
        </div>
      </div>`;
    const cv = card.querySelector('canvas'), pb = card.querySelector('.play');
    drawWave(cv, url);
    cv.onclick = ()=>togglePlay(url, cv, pb);
    pb.onclick = ()=>togglePlay(url, cv, pb);
    grid.append(card);
  });
}
async function unkeep(id){
  if(!confirm('Remove from library?')) return;
  await api('/api/library/'+id,{method:'DELETE'});
  loadLibrary(); loadStatus();
}

function esc(s){ return (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

loadStatus();
</script>
</body>
</html>
